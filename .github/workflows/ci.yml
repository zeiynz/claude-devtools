name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint skills
        run: python skills/skill-factory/scripts/lint_skill.py skills
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Repo health gate (dogfooding)
        run: python skills/repo-doctor/scripts/audit.py . --fail-under 90

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent2:#e0e7ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e6e8ee;--mut:#9aa3b2;--line:#2a313c;--accent:#818cf8;--accent2:#262a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.muted{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px}
select,input,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
svg text.lbl{fill:var(--mut);font-size:11px}svg line.grid{stroke:var(--line)}
.tw{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{cursor:pointer;user-select:none;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>__TITLE__</h1>
<div class="muted" id="sub"></div>
<div class="bar" id="controls"></div>
<div class="kpis" id="kpis"></div>
<div class="grid" id="charts"></div>
<div class="card tw" id="table"></div>
</main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const cols = P.cols, rows = P.rows;
const nums = cols.filter(c => c.type === "number").map(c => c.name);
const cats = cols.filter(c => c.type === "category").map(c => c.name);
const dates = cols.filter(c => c.type === "date").map(c => c.name);
const S = {f: {}, q: "", from: "", to: "", measure: nums[0] || "__count", sort: null, dir: 1, page: 0};
const PAGE = 25;
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null || isNaN(n) ? "-" : Math.abs(n) >= 1e9 ? (n/1e9).toFixed(2)+"B" : Math.abs(n) >= 1e6 ? (n/1e6).toFixed(2)+"M" : Math.abs(n) >= 1e4 ? (n/1e3).toFixed(1)+"K" : (Math.round(n*100)/100).toLocaleString();
const mname = () => S.measure === "__count" ? "Count" : S.measure;

function filtered() {
  const q = S.q.toLowerCase();
  return rows.filter(r => {
    for (const k in S.f) if (S.f[k] && String(r[k]) !== S.f[k]) return false;
    if (dates[0]) {
      const d = r[dates[0]];
      if (S.from && (!d || d < S.from)) return false;
      if (S.to && (!d || d > S.to)) return false;
    }
    if (q && !cols.some(c => String(r[c.name] == null ? "" : r[c.name]).toLowerCase().includes(q))) return false;
    return true;
  });
}

function groupBy(rs, keyFn) {
  const m = new Map();
  for (const r of rs) {
    const k = keyFn(r);
    if (k == null || k === "") continue;
    const v = S.measure === "__count" ? 1 : r[S.measure];
    if (v == null) continue;
    m.set(k, (m.get(k) || 0) + v);
  }
  return [...m.entries()];
}

const card = (title, inner) => `<div class="card"><h3>${esc(title)}</h3>${inner}</div>`;

function barChart(data, title) {
  data = data.sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (!data.length) return card(title, '<p class="muted">No data</p>');
  const max = Math.max(1, ...data.map(d => d[1])), W = 520, RH = 26, L = 130, H = data.length * RH + 8;
  const bars = data.map((d, i) => {
    const w = Math.max(2, (d[1] / max) * (W - L - 70)), y = i * RH + 4;
    return `<text x="${L-8}" y="${y+16}" text-anchor="end" class="lbl">${esc(String(d[0]).slice(0, 18))}</text>` +
      `<rect x="${L}" y="${y+3}" width="${w}" height="${RH-8}" rx="4" fill="var(--accent)"><title>${esc(d[0])}: ${fmt(d[1])}</title></rect>` +
      `<text x="${L+w+6}" y="${y+16}" class="lbl">${fmt(d[1])}</text>`;
  }).join("");
  return card(title, `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`);
}

function lineChart(data, title) {
  data.sort((a, b) => a[0] < b[0] ? -1 : 1);
  if (data.length < 2) return card(title, '<p class="muted">Not enough data</p>');
  const W = 520, H = 210, M = {l: 52, r: 12, t: 10, b: 26};
  let lo = 0, hi = -Infinity;
  for (const d of data) { if (d[1] < lo) lo = d[1]; if (d[1] > hi) hi = d[1]; }
  if (hi <= lo) hi = lo + 1;
  const x = i => M.l + i * (W - M.l - M.r) / (data.length - 1);
  const y = v => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d[1]).toFixed(1)}`).join(" ");
  const area = `${x(0).toFixed(1)},${y(lo).toFixed(1)} ${pts} ${x(data.length-1).toFixed(1)},${y(lo).toFixed(1)}`;
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${M.l}" x2="${W-M.r}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${M.l-6}" y="${y(v)+4}" text-anchor="end" class="lbl">${fmt(v)}</text>`).join("");
  const dots = data.length <= 60 ? data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[1])}" r="3" fill="var(--accent)"><title>${esc(d[0])}: ${fmt(d[1])}</title></circle>`).join("") : "";
  const ends = `<text x="${M.l}" y="${H-6}" class="lbl">${esc(data[0][0])}</text><text x="${W-M.r}" y="${H-6}" text-anchor="end" class="lbl">${esc(data[data.length-1][0])}</text>`;
  return card(title, `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}<polygon points="${area}" fill="var(--accent2)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}${ends}</svg>`);
}

function histogram(rs, col) {
  const v = rs.map(r => r[col]).filter(x => x != null);
  if (v.length < 2) return card("Distribution of " + col, '<p class="muted">Not enough data</p>');
  let lo = Infinity, hi = -Infinity;
  for (const x of v) { if (x < lo) lo = x; if (x > hi) hi = x; }
  const n = 10, step = (hi - lo) / n || 1, b = new Array(n).fill(0);
  for (const x of v) b[Math.min(n - 1, Math.floor((x - lo) / step))]++;
  const max = Math.max(...b), W = 520, H = 190, bw = (W - 20) / n;
  const bars = b.map((c, i) => {
    const h = (c / max) * (H - 40);
    return `<rect x="${10+i*bw+1}" y="${H-24-h}" width="${bw-2}" height="${h}" rx="3" fill="var(--accent)"><title>${fmt(lo+i*step)} to ${fmt(lo+(i+1)*step)}: ${c}</title></rect>`;
  }).join("");
  return card("Distribution of " + col, `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}<text x="10" y="${H-6}" class="lbl">${fmt(lo)}</text><text x="${W-10}" y="${H-6}" text-anchor="end" class="lbl">${fmt(hi)}</text></svg>`);
}

function renderControls() {
  let h = `<label>Measure<select id="m">${[...nums.map(n => `<option>${esc(n)}</option>`), '<option value="__count">Count</option>'].join("")}</select></label>`;
  for (const c of cats) {
    const vals = [...new Set(rows.map(r => r[c]).filter(v => v != null && v !== ""))].sort();
    if (vals.length <= 40) h += `<label>${esc(c)}<select data-f="${esc(c)}"><option value="">All</option>${vals.map(v => `<option>${esc(v)}</option>`).join("")}</select></label>`;
  }
  if (dates[0]) h += `<label>${esc(dates[0])} from<input type="date" id="from"></label><label>to<input type="date" id="to"></label>`;
  h += `<label>Search<input id="q" placeholder="filter rows..."></label><label>&nbsp;<button id="csv">Export CSV</button></label>`;
  $("controls").innerHTML = h;
  $("m").value = S.measure;
  $("m").onchange = e => { S.measure = e.target.value; update(); };
  document.querySelectorAll("[data-f]").forEach(el => el.onchange = e => { S.f[el.dataset.f] = e.target.value; S.page = 0; update(); });
  if (dates[0]) { $("from").onchange = e => { S.from = e.target.value; S.page = 0; update(); }; $("to").onchange = e => { S.to = e.target.value; S.page = 0; update(); }; }
  $("q").oninput = e => { S.q = e.target.value; S.page = 0; update(); };
  $("csv").onclick = exportCsv;
}

function renderKpis(rs) {
  let h = `<div class="card kpi"><span class="muted">Rows</span><b>${rs.length.toLocaleString()}</b></div>`;
  for (const n of nums.slice(0, 3)) {
    const v = rs.map(r => r[n]).filter(x => x != null), s = v.reduce((a, b) => a + b, 0);
    h += `<div class="card kpi"><span class="muted">${esc(n)} (sum)</span><b>${fmt(s)}</b><span class="muted">avg ${fmt(v.length ? s / v.length : null)}</span></div>`;
  }
  $("kpis").innerHTML = h;
}

function renderCharts(rs) {
  let h = "";
  if (dates[0]) {
    const months = new Set(rs.map(r => (r[dates[0]] || "").slice(0, 7)));
    const len = months.size >= 3 ? 7 : 10;
    h += lineChart(groupBy(rs, r => (r[dates[0]] || "").slice(0, len)), `${mname()} over time (${dates[0]})`);
  }
  for (const c of cats.slice(0, 2)) h += barChart(groupBy(rs, r => r[c]), `${mname()} by ${c} (top 10)`);
  if (nums[0]) h += histogram(rs, S.measure !== "__count" ? S.measure : nums[0]);
  $("charts").innerHTML = h || '<div class="card muted">No chartable columns detected.</div>';
}

function sorted(rs) {
  if (!S.sort) return rs;
  const k = S.sort, d = S.dir;
  return rs.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * d;
  });
}

function renderTable(rs) {
  const all = sorted(rs), pages = Math.max(1, Math.ceil(all.length / PAGE));
  S.page = Math.min(S.page, pages - 1);
  const slice = all.slice(S.page * PAGE, (S.page + 1) * PAGE);
  const head = cols.map(c => `<th data-s="${esc(c.name)}">${esc(c.name)}${S.sort === c.name ? (S.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = slice.map(r => "<tr>" + cols.map(c => `<td class="${c.type === "number" ? "n" : ""}">${c.type === "number" ? fmt(r[c.name]) : esc(r[c.name])}</td>`).join("") + "</tr>").join("");
  $("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` +
    `<div class="pg"><span class="muted">${all.length.toLocaleString()} rows - page ${S.page + 1}/${pages}</span><button id="prev">Prev</button><button id="next">Next</button></div>`;
  document.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { const k = th.dataset.s; S.dir = S.sort === k ? -S.dir : 1; S.sort = k; update(); });
  $("prev").onclick = () => { if (S.page > 0) { S.page--; renderTable(rs); } };
  $("next").onclick = () => { if (S.page < pages - 1) { S.page++; renderTable(rs); } };
}

function exportCsv() {
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = [cols.map(c => q(c.name)).join(",")].concat(filtered().map(r => cols.map(c => q(r[c.name])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = "filtered.csv";
  a.click();
}

function update() {
  const rs = filtered();
  $("sub").textContent = `${rs.length.toLocaleString()} of ${rows.length.toLocaleString()} rows - generated ${P.generated}`;
  renderKpis(rs); renderCharts(rs); renderTable(rs);
}

renderControls();
update();
</script>
</body>
</html>
